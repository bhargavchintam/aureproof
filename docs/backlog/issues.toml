# --- Milestones ---------------------------------------------------------------

[[milestone]]
title = "M0 Foundations"
description = "Interviews; repo + OSS kit + CI; worked example (pair #1); Inspect runner spike; Linux host. Gate: interview notes, clone green, spike verdict."

[[milestone]]
title = "M1 Offline integrity core"
description = "THR / Bundle / Decision specs + schemas + conformance vectors; matcher + metrics; hash chain + in-toto seal; CLI validate/score/report. Gate: golden counts match an independent calculation, offline."

[[milestone]]
title = "M2 Calibrated slice"
description = "3 fixture pairs with health controls; difficulty probe; one live episode via the Inspect bridge; signed bundle; offline re-score. Stop/go: the real commitment point."

[[milestone]]
title = "M3 Benchmark + gate"
description = "~20 cases with adjudication, canaries, private split; external subject; exact paired gate + GitHub Action; pilot; signed pre-registered protocol."

[[milestone]]
title = "M4 v0.1.0"
description = "Assessment (sanity + close contrasts); report; ABC self-assessment; Croissant card; EEE exporter; SBOM + PEP 740 + DOI; independent reproduction."

[[milestone]]
title = "M5 Upstream & audit"
description = "NeMo Gym #3675, in-toto #575, Harbor registry; public-benchmark health audit; arXiv report."

