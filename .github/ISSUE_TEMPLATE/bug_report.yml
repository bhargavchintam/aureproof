name: Bug report
description: Something behaves incorrectly or crashes.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Do not paste credentials, tokens, or private evaluation data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected versus what occurred. Include exact error text if short.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a command sequence that reproduces it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aureproof version / commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
    validations:
      required: true
