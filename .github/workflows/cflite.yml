#
# ClusterFuzzLite: fuzz the parsers of untrusted input (strict JSON, agent
# submissions, evidence bundles). Pull requests that touch them get a short
# code-change run; a weekly batch run explores further.
name: ClusterFuzzLite

on:
  pull_request:
    paths:
      - "src/aureproof/contracts/**"
      - "src/aureproof/scoring/**"
      - "src/aureproof/bundle/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite.yml"
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 120 || 900 }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          output-sarif: false
