#
# Independent consumer for the Every Eval Ever export (issue #59): the pinned
# every-eval-ever 0.3.0 validator checks the committed example records, in its
# own isolated environment. Offline inputs only; no secrets.
name: EEE consumer

on:
  push:
    branches: [main]
    paths: ["examples/eee/**", "src/aureproof/exporters/**", ".github/workflows/eee-consumer.yml"]
  pull_request:
    paths: ["examples/eee/**", "src/aureproof/exporters/**", ".github/workflows/eee-consumer.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: every-eval-ever 0.3.0 validates the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - name: Examples match the exporter
        run: uv run python scripts/make_eee_examples.py --check
      - name: Validate with every-eval-ever 0.3.0
        working-directory: examples/eee
        run: uvx --from every-eval-ever==0.3.0 every_eval_ever validate "data/aureproof-security/*/*/*.json" --format github
