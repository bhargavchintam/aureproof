#
# Keyless Sigstore signing (issue #46). This workflow, running on main, IS the
# project's signer identity:
#   https://github.com/bhargavchintam/aureproof/.github/workflows/sign.yml@refs/heads/main
# issued by https://token.actions.githubusercontent.com. It signs the exact
# canonical bytes of a bundle seal or a protocol, verifies the result offline,
# and uploads the signature as an artifact for a maintainer to commit by PR.
name: Sign

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle directory or canonical JSON file to sign"
        required: true
        default: "examples/bundles/tutorial-v0.1"

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Fulcio; the only write permission
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - name: Install (locked, with the sign extra)
        run: uv sync --frozen --extra sign
      - name: Validate before signing
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ -d "$TARGET" ]; then uv run aureproof validate "$TARGET"; fi
      - name: Sign with the workflow identity and verify offline
        env:
          TARGET: ${{ inputs.target }}
        run: |
          uv run aureproof sign "$TARGET"
          uv run aureproof verify "$TARGET"
      - name: Collect the signature
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p out
          if [ -d "$TARGET" ]; then cp "$TARGET/seal.sigstore.json" out/; else cp "$TARGET.sigstore.json" out/; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: out/
          if-no-files-found: error
