#
# Publish to PyPI with Trusted Publishing (OIDC; no stored tokens) and PEP 740
# attestations (issue #37). Runs ONLY when a maintainer publishes a GitHub
# Release; never on pushes or pull requests. The `pypi` environment must be
# protected (required reviewer). See docs/guides/releasing.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build, test, fresh-install gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - name: Tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != v${version}"; exit 1; }
      - name: Full test suite (locked)
        run: uv sync --frozen && uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Phase-1 gate from a fresh install of the wheel
        run: |
          uv venv --python 3.12 /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          /tmp/fresh/bin/aureproof score examples/bundles/tutorial-v0.1 --offline --json > /tmp/phase1.json
          /tmp/fresh/bin/python scripts/check_phase1.py /tmp/phase1.json
      - name: SBOM (CycloneDX 1.5), kept out of dist/ so PyPI gets packages only
        run: |
          mkdir -p sbom
          uv export --format cyclonedx1.5 --frozen --no-dev -o "sbom/aureproof-${GITHUB_REF_NAME#v}.cdx.json"
          uv run python scripts/check_sbom.py sbom/*.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aureproof
    permissions:
      id-token: write # OIDC for Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true # PEP 740

  attach:
    # After PyPI accepts the files: sign them, and the SBOM, with this workflow's
    # identity and attach everything to the GitHub release (Scorecard Signed-Releases).
    name: attach signed files and the SBOM to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # OIDC token for Fulcio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - name: Install (locked, with the sign extra)
        run: uv sync --frozen --extra sign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Sign with the workflow identity and verify
        run: |
          uv run sigstore sign dist/*.whl dist/*.tar.gz sbom/*.cdx.json
          uv run sigstore verify identity \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            dist/*.whl dist/*.tar.gz sbom/*.cdx.json
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* sbom/* --repo "$GITHUB_REPOSITORY" --clobber
